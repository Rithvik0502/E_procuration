{% extends "base.html" %}
{% block content %}
<h1>Farmer login</h1>
<p>Enter the details you registered with.</p>

<form class="form-card" method="POST" action="{{ url_for('login') }}">
  <div class="field">
    <label for="reg_id">Registration ID</label>
    <input type="text" id="reg_id" name="reg_id" placeholder="e.g. REG01" required>
  </div>
  <div class="field">
    <label for="name">Full name</label>
    <input type="text" id="name" name="name" required>
  </div>
  <div class="field">
    <label for="mobile">Mobile number</label>
    <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" maxlength="10" required>
  </div>
  <button class="btn btn-primary" type="submit">Log in</button>
  <div class="form-foot">New here? <a href="{{ url_for('register') }}">Register instead</a>.</div>
</form>
{% endblock %}
