{% extends "base.html" %}
{% block content %}
<h1>Procurement centre staff login</h1>
<p>Demo credentials: <span class="mono">admin</span> / <span class="mono">admin123</span></p>

<form class="form-card" method="POST" action="{{ url_for('admin_login') }}">
  <div class="field">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
  </div>
  <button class="btn btn-primary" type="submit">Log in</button>
</form>
{% endblock %}
